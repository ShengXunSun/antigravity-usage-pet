<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Pet</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=7">
</head>
<body>
  <div class="container">
    <!-- Top Section: Live Token Usage Cards -->
    <div class="dashboard" id="dashboard">
      <!-- Current Chat Card -->
      <div class="usage-card">
        <div class="card-header">
          <div class="header-left">
            <span class="live-dot"></span>
            <span class="title">Current Chat</span>
            <span class="chat-id mono" id="val-conv">—</span>
          </div>
          <span class="badge" id="status-badge">Live</span>
        </div>

        <div class="hero-grid">
          <div class="hero-metric">
            <span class="metric-label">Last Reply</span>
            <span class="metric-big" id="val-last-reply">—</span>
            <span class="metric-sub" id="sub-last-reply">In: — · Cache: — · Out: —</span>
          </div>
          <div class="hero-metric">
            <span class="metric-label">This Chat Total</span>
            <span class="metric-big accent" id="val-chat-total">—</span>
            <span class="metric-sub" id="sub-chat-total">In: — · Cache: — · Out: —</span>
          </div>
        </div>
      </div>

      <!-- 5-Hour & Weekly Totals Card -->
      <div class="usage-card">
        <div class="card-header">
          <span class="title">Token Usage Summary</span>
          <span class="muted-tag" id="val-chat-count">0 chats</span>
        </div>

        <div class="window-row">
          <div class="window-info">
            <span class="window-title">Last 5 Hours</span>
            <span class="window-sub" id="sub-5h">In — · Cache — · Out —</span>
          </div>
          <span class="window-total" id="val-5h">—</span>
        </div>

        <div class="window-row">
          <div class="window-info">
            <span class="window-title">This Week (7d)</span>
            <span class="window-sub" id="sub-week">In — · Cache — · Out —</span>
          </div>
          <span class="window-total accent" id="val-week">—</span>
        </div>
      </div>
    </div>

    <!-- Bottom Section: Gemini Pet Stage -->
    <div class="pet-stage" id="pet-stage" title="Click me!">
      <div class="speech-bubble" id="speech-bubble">
        Tracking your live tokens, nya~ ✨
      </div>
      <div class="pet-avatar" id="pet-avatar">
        <img src="/pet.png?v=6" alt="Gemini Pet" class="pet-img" draggable="false" />
      </div>
    </div>
  </div>
  <script src="/app.js?v=7"></script>
</body>
</html>
