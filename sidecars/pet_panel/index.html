<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Pet</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <div class="container">
    <div class="status-card">
      <div class="card-header">
        <span class="title">Gemini Pet Diagnostics</span>
        <span class="badge" id="status-badge">Connecting...</span>
      </div>
      <div class="stat-row">
        <span class="label">Version</span>
        <span class="value" id="val-version">—</span>
      </div>
      <div class="stat-row">
        <span class="label">Active Chat ID</span>
        <span class="value mono" id="val-conv">—</span>
      </div>
      <div class="stat-row">
        <span class="label">Chats Found</span>
        <span class="value" id="val-count">—</span>
      </div>
    </div>

    <div class="pet-stage" id="pet-stage" title="Click me!">
      <div class="speech-bubble" id="speech-bubble">
        Hi! I'm your Gemini Usage Pet ✨ (v0.1-base connected!)
      </div>
      <div class="pet-avatar" id="pet-avatar">
        <img src="/pet.png?v=5" alt="Gemini Pet" class="pet-img" draggable="false" />
      </div>
    </div>
  </div>
  <script src="/app.js?v=5"></script>
</body>
</html>
